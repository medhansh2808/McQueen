[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "mcqueen"
version = "0.1.0"
description = "Autonomous driving stack for a 1/10-scale RC car (Jetson Nano edge + RTX 4090 realtime inference)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "opencv-python-headless>=4.5",
    "Pillow>=8.0",
]

[project.optional-dependencies]
edge = ["Jetson.GPIO>=2.0.17"]
rtx = ["onnxruntime>=1.14", "websocket-client>=1.4", "aiohttp>=3.8"]
train = ["torch>=2.0", "onnx>=1.13", "pandas>=1.3"]

[tool.setuptools.packages.find]
include = ["mcqueen_ml*"]